version: "3.8"

services:
  juice-shop:
    image: bkimminich/juice-shop:v17.2.0
    container_name: tiendacr-juice-shop-nuevo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - juice-shop-data:/juice-shop/data
    security_opt:
      - no-new-privileges:true

volumes:
  juice-shop-data:
